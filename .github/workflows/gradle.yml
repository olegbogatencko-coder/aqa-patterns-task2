name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT
        run: java -jar ./artifacts/app-ibank.jar -P:profile=test &

      - name: Wait for SUT to start
        run: sleep 5

      - name: Build with Gradle
        # Добавляем аргументы для Chrome:
        # --no-sandbox: отключает песочницу (обязательно для CI)
        # --disable-dev-shm-usage: решает проблемы с нехваткой памяти
        run: ./gradlew test --info -Dselenide.headless=true -Dchromeoptions.args=--no-sandbox,--disable-dev-shm-usage